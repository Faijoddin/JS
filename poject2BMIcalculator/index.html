<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <a href="/" aria-current="page">Home</a>
        <a target="_blank" href="https://www.youtube.com/@chaiaurcode">Youtube channel</a>
    </nav>
                                                        
    <div class="container">
        <form>
            <h1>BMI Calculator</h1>
            <p><label>Height in CM:</label><input type="text" id="height"></p>
            <p><label>Weight in KG:</label><input type="text" id="weight"></p>
            <button>Calculate</button>
            <div id="result"></div>
            <div id="weight-guide">
                <p class="messg"  id="underweight">Under weight = Less than 18.06</p>
                <p class="messg" id="normalrange">Normal Range = 18.6 and 24.9</p>
                <p class="messg" id="overweight">Overweight = Greater than 24.9</p>
            </div>
        </form>
    </div>


<script src="script.js"></script>    
</body>
</html>
